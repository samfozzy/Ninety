<style>
/* Layout idea: a lab-instrument patient app inside a phone, beside a judge's brief that maps each challenge requirement to a live screen.
   Palette taken from semen-morphology stains: haematoxylin ink and violet, with eosin rose used only for the 90-day dial and key highlights. */
:root{
  --paper:#F4F4F9;
  --card:#FFFFFF;
  --ink:#1D1A36;
  --muted:#5E5A7A;
  --line:#DEDCEA;
  --hema:#3D3589;
  --eosin:#C23F69;
  --eosin-soft:#F7E4EB;
  --hema-soft:#E9E7F6;
  --frame:#1D1A36;
  --ok:#2C7A57; --ok-soft:#E1F1E8;
  --warn:#A86A12; --warn-soft:#FBEFD9;
  --crit:#B42318; --crit-soft:#FBE3E0;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --arabic:"IBM Plex Sans Arabic", "Geeza Pro", "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121120; --card:#1B1A2D; --ink:#EDEBF8; --muted:#A9A5C6; --line:#302E49;
    --hema:#9C94EE; --eosin:#E8789A; --eosin-soft:#3A2030; --hema-soft:#26234A; --frame:#0A0915;
    --ok:#5FC596; --ok-soft:#183427; --warn:#E2AA4E; --warn-soft:#3A2B12; --crit:#F2786C; --crit-soft:#3D1A17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121120; --card:#1B1A2D; --ink:#EDEBF8; --muted:#A9A5C6; --line:#302E49;
  --hema:#9C94EE; --eosin:#E8789A; --eosin-soft:#3A2030; --hema-soft:#26234A; --frame:#0A0915;
  --ok:#5FC596; --ok-soft:#183427; --warn:#E2AA4E; --warn-soft:#3A2B12; --crit:#F2786C; --crit-soft:#3D1A17;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-0.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--eosin);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}

/* Top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 24px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-0.02em}
.brand b i{font-style:normal;color:var(--eosin)}
.brand span{font-size:13px;color:var(--muted)}
.views{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.views button{border:0;background:none;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.views button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.hidebtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px}

/* App view */
.appview{display:grid;grid-template-columns:minmax(280px,420px) 390px;gap:40px;justify-content:center;align-items:start;padding:28px 24px 48px}
.brief{display:flex;flex-direction:column;gap:16px}
.brief h1{font-size:34px}
.brief .lede{color:var(--muted);max-width:60ch}
.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.req{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.req .n{font-family:var(--mono);font-size:12px;color:var(--hema);border:1px solid var(--hema);border-radius:6px;text-align:center;padding:1px 0;margin-top:2px}
.req b{display:block;font-size:14px}
.req p{font-size:13px;color:var(--muted)}
.req button{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:12px;white-space:nowrap}
.req.on{border-color:var(--hema);box-shadow:inset 3px 0 0 var(--hema)}
.pfbox{padding:14px 16px;border-radius:14px;background:var(--eosin-soft);border:1px solid color-mix(in srgb,var(--eosin) 30%,transparent)}
.pfbox h3{font-size:18px;margin-bottom:6px}
.pfbox ul{margin:6px 0 10px;padding-left:18px;font-size:13px}
.pfbox button{border:0;background:var(--eosin);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.disclaim{font-size:12px;color:var(--muted)}

.phone{width:390px;height:820px;border:10px solid var(--frame);border-radius:46px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(29,26,54,.45)}
.status{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 6px;font-size:12px;font-family:var(--mono);color:var(--muted)}
.status .pill{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-family:var(--body)}
.screen{flex:1;overflow-y:auto;padding:8px 18px 28px;display:flex;flex-direction:column;gap:16px}
.tabbar{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--card)}
.tabbar button{border:0;background:none;padding:9px 2px 11px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button svg{width:20px;height:20px}
.tabbar button[aria-current="true"]{color:var(--eosin);font-weight:600}

/* Phone content */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scr-h{font-size:26px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.card.soft{background:var(--paper)}
.card h3{font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;line-height:1.5}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.crit{background:var(--crit-soft);color:var(--crit)}
.tag.hema{background:var(--hema-soft);color:var(--hema)}
.tag.eosin{background:var(--eosin-soft);color:var(--eosin)}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;font-size:14px;background:var(--ink);color:var(--paper);text-align:center}
.btn.alt{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.eosin{background:var(--eosin);color:#fff}
.btn.crit{background:var(--crit);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.trust{display:flex;flex-wrap:wrap;gap:6px}
.trust span{font-size:12px;border:1px dashed var(--line);border-radius:8px;padding:3px 8px;color:var(--muted)}
.dial{display:flex;align-items:center;gap:14px}
.dial svg{flex:none}
.dial-track{fill:none;stroke:var(--hema-soft);stroke-width:12}
.dial-prog{fill:none;stroke:var(--eosin);stroke-width:12;stroke-linecap:round}
.dial-tick{stroke:var(--line);stroke-width:1.5}
.dial-mark{fill:var(--card);stroke:var(--hema);stroke-width:2.5}
.dial-mark.done{fill:var(--hema)}
.dial-num{font-family:var(--display);font-weight:700;fill:var(--ink)}
.dial-sub{font-family:var(--mono);fill:var(--muted)}
.next{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.next.t1{background:var(--ok-soft);border-color:transparent}
.next.t2{background:var(--hema-soft);border-color:transparent}
.next.t3{background:var(--warn-soft);border-color:transparent}
.next.t4{background:var(--eosin-soft);border-color:transparent}
.next.t5{background:var(--crit-soft);border-color:var(--crit)}
.next h3{font-size:20px}
.todo{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.todo li::before{content:"";flex:none;width:14px;height:14px;border:1.5px solid var(--hema);border-radius:4px;margin-top:3px}
.rtl{direction:rtl;text-align:right;font-family:var(--arabic)}

/* Intake */
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--eosin)}
.q{display:flex;flex-direction:column;gap:7px;padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q label,.q .ql{font-size:14px;font-weight:600}
.q input[type="number"]{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:var(--mono);font-size:15px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;width:100%;font-size:14px;font-weight:500}
.tog .sw{flex:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.tog[aria-pressed="true"] .sw{background:var(--hema)}
.tog[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.why{font-size:13px;color:var(--muted);background:var(--paper);border-radius:10px;padding:8px 10px}
.navrow{display:flex;gap:8px}
.navrow .btn{flex:1}

/* Results */
.banner{border-radius:14px;padding:12px 14px;background:var(--crit);color:#fff;display:flex;flex-direction:column;gap:4px}
.banner b{font-size:16px}
.ladder{display:flex;flex-direction:column;gap:4px}
.rung{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.rung .k{font-family:var(--mono);font-size:12px}
.rung.on{color:var(--ink);font-weight:600;border-color:var(--ink);background:var(--paper)}
.rung.also{color:var(--ink);border-style:dashed}
.sig{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sig .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.sig b{font-size:14.5px}
.sig p{font-size:13.5px}
.src{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rule{font-family:var(--mono);font-size:11px;color:var(--hema)}
.domains{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.dom{border-radius:10px;padding:8px 10px;background:var(--paper);font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.dom b{font-family:var(--mono)}

/* Semen chart */
.sa{display:flex;flex-direction:column;gap:10px}
.sarow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px}
.sarow .v{font-family:var(--mono);font-weight:600;text-align:right}
.sarow .v.low{color:var(--crit)}
.bar{grid-column:1 / -1;position:relative;height:10px;border-radius:6px;background:var(--hema-soft)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--hema)}
.bar .fill.low{background:var(--crit)}
.bar .ref{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.sarow .refl{grid-column:1 / -1;font-size:11px;color:var(--muted);font-family:var(--mono)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:12px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-family:var(--mono);font-size:14px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px}
.opt .ic{width:34px;height:34px;border-radius:9px;background:var(--hema-soft);color:var(--hema);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600}
.opt b{font-size:14px}
.opt p{font-size:13px;color:var(--muted)}
.qrbox{display:flex;gap:12px;align-items:center}
.qrbox #qr{width:112px;height:112px;flex:none;background:#fff;border-radius:8px;padding:6px;display:grid;place-items:center}
.qrbox #qr img,.qrbox #qr canvas{width:100px!important;height:100px!important}
.code{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:.04em}

/* Plan */
.ntable{width:100%;border-collapse:collapse;font-size:12.5px}
.ntable th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 4px;border-bottom:1px solid var(--line)}
.ntable td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.ntable td:first-child{font-weight:600}
.tablewrap{overflow-x:auto}
.ev{display:flex;flex-direction:column;gap:6px;font-size:13px}
.ev div{padding:8px 10px;border-radius:10px;background:var(--paper)}
.ev b{font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-family:var(--mono)}
.meter{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.meter .track{height:8px;border-radius:5px;background:var(--hema-soft);position:relative;overflow:hidden}
.meter .track i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:5px}
.meter .track i.over{background:var(--crit)}
.meter .num{font-size:12px}
.warnlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.warnlist li{font-size:13px;padding:8px 10px;border-radius:10px;background:var(--warn-soft);color:var(--ink)}
.warnlist li.crit{background:var(--crit-soft)}
.days{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.days button{aspect-ratio:1;border:1px solid var(--line);border-radius:7px;background:var(--card);font-family:var(--mono);font-size:11px;color:var(--muted);padding:0}
.days button[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:#fff}
.days button.today{outline:2px solid var(--eosin);outline-offset:1px}
.miles{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.miles li{display:grid;grid-template-columns:58px 1fr auto;gap:8px;font-size:13px;align-items:baseline}
.miles .d{font-family:var(--mono);color:var(--hema);font-weight:600}

/* Privacy */
.inv{display:flex;flex-direction:column;gap:4px;font-size:13px}
.inv div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.inv div span:last-child{font-family:var(--mono);color:var(--muted)}
.promise{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.netlog{font-family:var(--mono);font-size:12px;background:var(--paper);border-radius:10px;padding:8px 10px;color:var(--muted)}

/* Wide views */
.wide{max-width:1180px;margin:0 auto;padding:28px 24px 56px;display:flex;flex-direction:column;gap:20px}
.wide h1{font-size:34px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tile .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1}
.tile .lab{font-size:13px;color:var(--muted)}
.clinic{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:16px;align-items:start}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.sel td{background:var(--hema-soft)}
.tbl tr[data-act]{cursor:pointer}
.tbl tr[data-act]:hover td{background:var(--paper)}
.tierpill{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px}
.tierpill.t1{background:var(--ok-soft);color:var(--ok)}
.tierpill.t2{background:var(--hema-soft);color:var(--hema)}
.tierpill.t3{background:var(--warn-soft);color:var(--warn)}
.tierpill.t4{background:var(--eosin-soft);color:var(--eosin)}
.tierpill.t5{background:var(--crit-soft);color:var(--crit)}
.panel{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:84px}
.panel h2{font-size:22px}
.audit{font-family:var(--mono);font-size:12px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.audit div{border-left:2px solid var(--hema);padding-left:8px}
select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:13px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pass{color:var(--ok);font-weight:600}
.fail{color:var(--crit);font-weight:600}
.refs{margin:0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.refs a{color:var(--hema)}
.box{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.box h2{font-size:21px}
.box ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}

/* Quick hide */
#hide{position:fixed;inset:0;z-index:100;background:#F2F5F3;color:#24302A;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:var(--body)}
#hide.on{display:flex}
#hide .steps-n{font-size:56px;font-weight:700;font-family:var(--mono)}
#hide button{border:0;background:none;color:#7A867F;font-size:12px;margin-top:30px}

@media (max-width:900px){
  .appview{grid-template-columns:1fr;justify-items:center}
  .brief{position:static;order:2;max-width:560px}
  .phone{order:1}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .clinic,.cols2,.cols3{grid-template-columns:1fr}
  .panel{position:static}
}
@media (max-width:480px){
  .top{padding:10px 16px;gap:10px}
  .brand span{display:none}
  .views{order:3;width:100%}
  .views button{flex:1;padding:6px 4px;font-size:12.5px}
  .appview{padding:0 0 32px;gap:24px}
  .phone{width:100%;height:auto;min-height:calc(100vh - 110px);border:0;border-radius:0;box-shadow:none}
  .status{display:none}
  .tabbar{position:sticky;bottom:0}
  .brief{padding:0 16px}
  .wide{padding:20px 16px 40px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Ninety<i>.</i></b><span>Private front door to men's reproductive health · prototype on synthetic data</span></div>
  <nav class="views" aria-label="Views">
    <button data-act="view" data-v="app" id="v-app">Patient app</button>
    <button data-act="view" data-v="clinic" id="v-clinic">Clinician console</button>
    <button data-act="view" data-v="evidence" id="v-evidence">Evidence &amp; safety</button>
  </nav>
  <button class="hidebtn" data-act="hide" id="hidebtn" title="Esc also works">Quick hide</button>
</header>

<main>
  <section id="view-app" class="appview">
    <aside class="brief" id="brief"></aside>
    <div class="phone" aria-label="Ninety patient app">
      <div class="status"><span id="clock">09:41</span><span class="pill">On this device only</span></div>
      <div class="screen" id="screen" tabindex="-1"></div>
      <nav class="tabbar" id="tabbar" aria-label="App sections"></nav>
    </div>
  </section>
  <section id="view-clinic" class="wide" hidden></section>
  <section id="view-evidence" class="wide" hidden></section>
</main>

<div id="hide" role="dialog" aria-label="Neutral screen">
  <div class="tiny">Today</div>
  <div class="steps-n">6,214</div>
  <div>steps · keep going</div>
  <button data-act="unhide" id="unhide">Return</button>
</div>

function dial(day, size){
  size = size || 150; var c = size/2, r = c - 12, circ = 2*Math.PI*r, frac = Math.min(day,90)/90;
  var ticks = '';
  for(var d=0; d<90; d+=10){ var ang = d/90*2*Math.PI - Math.PI/2; ticks += '<line class="dial-tick" x1="'+(c+Math.cos(ang)*(r-9))+'" y1="'+(c+Math.sin(ang)*(r-9))+'" x2="'+(c+Math.cos(ang)*(r-15))+'" y2="'+(c+Math.sin(ang)*(r-15))+'"/>'; }

  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" role="img" aria-label="Day '+day+' of 90">'+
    '<circle class="dial-track" cx="'+c+'" cy="'+c+'" r="'+r+'"/>'+
    '<circle class="dial-prog" cx="'+c+'" cy="'+c+'" r="'+r+'" stroke-dasharray="'+(circ*frac).toFixed(1)+' '+circ.toFixed(1)+'" transform="rotate(-90 '+c+' '+c+')"/>'+
    ticks + marks +

    '<text class="dial-sub" x="'+c+'" y="'+(c+size*0.17)+'" text-anchor="middle" font-size="'+(size*0.075)+'">OF 90 DAYS</text></svg>';
}

      '<tr><td>User trust</td><td>Post-visit trust and privacy score, 1 to 5</td><td class="num">≥ 4.2</td></tr>'+
      '<tr><td>Fairness</td><td>Gap in completion across age, language and income groups</td><td class="num">≤ 10 points</td></tr>'+
      '<tr><td>Clinician agreement</td><td>Engine tier confirmed unchanged</td><td class="num">≥ 85%</td></tr></tbody></table></div><p class="tiny muted">Targets, not results. They are set before the pilot so the pilot can fail honestly.</p></div>'+
    '<div class="box"><h2>Sources</h2><ol class="refs">'+
      '<li>Future Health Digital Innovation Challenge 2026, Fertility Challenge 01: Male Reproductive Health. <a href="https://hack2skill.com/event/futurehealthchallenge/">hack2skill.com</a></li>'+
      '<li>WHO laboratory manual for the examination and processing of human semen, 6th ed., 2021 (lower reference limits).</li>'+
      '<li>Schlegel PN et al. Diagnosis and treatment of infertility in men: AUA/ASRM guideline, 2020; amended 2024.</li>'+
      '<li>Agarwal A et al. Global Andrology Forum clinical guidelines on antioxidant use in male infertility. World J Mens Health, 2026.</li>'+
      '<li>Steiner AZ et al. The MOXI randomized clinical trial. Fertil Steril, 2020.</li>'+
      '<li>Lipovac M et al. Micronutrient supplementation, sperm DNA integrity and pregnancy rates. Gynecol Endocrinol, 2021.</li>'+
      '<li>Imhof M et al. Improvement of sperm quality after micronutrient supplementation. e-SPEN, 2012.</li>'+
      '<li>Levine H et al. Temporal trends in sperm count. Hum Reprod Update, 2023.</li>'+
      '<li>Eisenberg ML et al. Semen quality, infertility and mortality in the USA. Hum Reprod, 2014.</li>'+
      '<li>Kanakasabapathy MK et al. Smartphone-based point-of-care semen analysis. Sci Transl Med, 2017.</li>'+
      '<li>NIH Office of Dietary Supplements. Zinc fact sheet (adult upper limit 40 mg/day).</li>'+
      '<li>NICE NG12. Suspected cancer: recognition and referral.</li></ol></div>';
}

/* ---------- master render ---------- */
var evidenceDone = false;
function render(){
  ['app','clinic','evidence'].forEach(function(v){ $('#view-'+v).hidden = S.view !== v; $('#v-'+v).setAttribute('aria-current', S.view===v); });
  renderBrief();
  if(S.view === 'app'){
    var sc = $('#screen'), keep = sc.dataset.scr === S.screen ? sc.scrollTop : 0;
    var R = assess(S.answers, S.semen), html;
    if(S.screen==='home') html = scrHome(R);
    else if(S.screen==='check') html = scrCheck();
    else if(S.screen==='results') html = scrResults(R);
    else if(S.screen==='tests') html = scrTests(R);
    else if(S.screen==='plan') html = scrPlan(R);
    else html = scrPrivacy();
    sc.innerHTML = html; sc.dataset.scr = S.screen; sc.scrollTop = keep;
    $('#tabbar').innerHTML = TABS.map(function(t){ return '<button data-act="go" data-v="'+t[0]+'" aria-current="'+(S.screen===t[0])+'">'+IC[t[0]]+'<span>'+t[1]+'</span></button>'; }).join('');
    if(S.screen==='tests' && S.share){ var q = $('#qr'); if(q){ try{ var qq = qrcode(0, 'M'); qq.addData('NINETY-SHARE:'+S.share.code+' (prototype)'); qq.make(); q.innerHTML = qq.createSvgTag(3, 0); var sv = q.querySelector('svg'); if(sv){ sv.setAttribute('width','100'); sv.setAttribute('height','100'); } }catch(e){ q.innerHTML = '<span class="tiny muted">QR unavailable</span>'; } } }
  }
  if(S.view === 'clinic') renderClinic();
  if(S.view === 'evidence' && !evidenceDone){ renderEvidence(); evidenceDone = true; }
  persist();
}

var SCREENS = ['home','check','results','tests','plan','privacy'];
function route(){
  var h = (location.hash || '#home').slice(1);
  if(h === 'clinic' || h === 'evidence') S.view = h;
  else { S.view = 'app'; S.screen = SCREENS.indexOf(h) >= 0 ? h : 'home'; }
  render();
  if(S.view === 'app') $('#screen').scrollTop = 0;
}
function go(h){ if(location.hash === '#'+h) route(); else location.hash = h; }
window.addEventListener('hashchange', route);

function stamp(){ var d = new Date(); return d.toTimeString().slice(0,5); }
function newCode(){ var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = 'NIN-'; for(var i=0;i<3;i++) s += c[Math.floor(Math.random()*c.length)]; s += '-'; for(i=0;i<3;i++) s += c[Math.floor(Math.random()*c.length)]; return s; }

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if(!el) return;
  if(pendingRender){ clearTimeout(pendingRender); pendingRender = null; }
  var act = el.dataset.act, v = el.dataset.v, k = el.dataset.k;
  if(act !== 'delete') S.delArmed = false;
  switch(act){
    case 'view': go(v === 'app' ? S.screen : v); return;
    case 'go': if(v === 'check' && S.screen !== 'check') S.step = 0; go(v); return;
    case 'set': S.answers[k] = v; S.example = false; break;
    case 'flag': S.answers[k] = !S.answers[k]; S.example = false; break;
    case 'list': var arr = S.answers[k] || []; var ix = arr.indexOf(v); if(ix>=0) arr.splice(ix,1); else arr.push(v); S.answers[k] = arr; S.example = false; break;
    case 'next': S.step = Math.min(STEPS.length-1, S.step+1); render(); $('#screen').scrollTop = 0; return;
    case 'prev': S.step = Math.max(0, S.step-1); render(); $('#screen').scrollTop = 0; return;
    case 'fresh': S.answers = clone(BASE); S.answers.age = ''; S.answers.goal = ''; S.semen = null; S.example = false; S.step = 0; S.share = null; S.taken = {}; S.reportText = ''; S.reportMsg = ''; go('check'); return;
    case 'example': S.answers = clone(EXAMPLE_ANSWERS); S.semen = clone(EXAMPLE_SEMEN); S.example = true; S.reportText = SAMPLE_REPORT; break;
    case 'lang': S.lang = v; break;
    case 'sample': S.reportText = SAMPLE_REPORT; S.reportMsg = 'Example report loaded. Press Read report.'; break;
    case 'read':
      var txt = ($('#report') || {}).value || S.reportText; S.reportText = txt;
      var p = parseReport(txt), found = Object.keys(p).filter(function(x){ return p[x] != null; });
      if(!found.length){ S.reportMsg = 'No values found. Check the text includes labels such as "concentration" and "progressive motility".'; }
      else { S.semen = p; S.reportMsg = 'Read '+found.length+' values: '+found.join(', ')+'. Check them against your paper report.'; }
      break;
    case 'clear-semen': S.semen = null; S.reportMsg = ''; break;
    case 'shareitem': S.shareItems[k] = !S.shareItems[k]; break;
    case 'share':
      var labels = {summary:'summary and tier', signals:'risk signals', semen:'semen results', plan:'90-day plan', sexual:'sexual-health answers'};
      var items = Object.keys(S.shareItems).filter(function(x){return S.shareItems[x];}).map(function(x){return labels[x];});
      if(!items.length) items = ['summary and tier'];
      S.share = {code:newCode(), items:items}; S.copyMsg = '';
      S.shareLog.unshift(stamp()+' · share code '+S.share.code+' created ('+items.join(', ')+'), expires in 72 h');
      S.audit.push({code:S.share.code, t:stamp(), msg:'packet received; engine proposed T'+assess(S.answers,S.semen).tier});
      break;
    case 'copy':
      try{ navigator.clipboard.writeText(S.share.code).then(function(){ S.copyMsg = 'Code copied.'; render(); }, function(){ S.copyMsg = 'Copy blocked here; the code is shown above.'; render(); }); }catch(err){ S.copyMsg = 'Copy blocked here; the code is shown above.'; }
      return;
    case 'revoke': S.shareLog.unshift(stamp()+' · share code '+S.share.code+' revoked'); S.share = null; break;
    case 'stack': S.stack[k] = !S.stack[k]; break;
    case 'take': S.taken[v] = !S.taken[v]; break;
    case 'consent': S.consents[k] = !S.consents[k]; S.shareLog.unshift(stamp()+' · '+k+' turned '+(S.consents[k]?'on':'off')+' (nothing sent in this prototype)'); break;
    case 'delete':
      if(!S.delArmed){ S.delArmed = true; break; }
      S.delArmed = false; S.answers = clone(BASE); S.answers.age=''; S.answers.goal=''; S.semen = null; S.taken = {}; S.stack = {}; S.share = null; S.shareLog = ['Everything deleted at '+stamp()+'.']; S.consents = {device:false, ai:false, research:false, partner:false}; S.example = false; S.reportText='';
      try{ localStorage.removeItem('ninety_v1'); }catch(err){}
      break;
    case 'undelete': S.delArmed = false; break;
    case 'hide': $('#hide').classList.add('on'); $('#unhide').focus(); return;
    case 'unhide': $('#hide').classList.remove('on'); return;
    case 'sel': S.sel = v; break;
    case 'confirm': S.audit.push({code:S.sel, t:stamp(), msg:'clinician confirmed tier; booking released'}); setStatus(S.sel, 'Confirmed'); break;
    case 'change':
      var nt = +$('#newtier').value, rs = $('#reason').value;
      setTier(S.sel, nt); S.audit.push({code:S.sel, t:stamp(), msg:'clinician changed tier to T'+nt+' · '+rs}); setStatus(S.sel, 'Tier changed'); break;
    case 'askinfo': S.audit.push({code:S.sel, t:stamp(), msg:'question sent to user through their share code'}); setStatus(S.sel, 'Waiting for user'); break;
  }
  render();
});
function setStatus(code, st){ S.queue.forEach(function(r){ if(r.code===code) r.status = st; }); if(S.share && S.share.code===code) S.share.status = st; }
function setTier(code, t){ S.queue.forEach(function(r){ if(r.code===code) r.tier = t; }); }
document.addEventListener('input', function(e){
  var f = e.target.dataset && e.target.dataset.field; if(!f) return;
  if(f === '__report'){ S.reportText = e.target.value; return; }
  S.answers[f] = e.target.value === '' ? '' : +e.target.value; S.example = false;
});
var pendingRender = null;
document.addEventListener('change', function(e){ var f = e.target.dataset && e.target.dataset.field; if(f && f !== '__report'){ clearTimeout(pendingRender); pendingRender = setTimeout(function(){ pendingRender = null; var a = document.activeElement; if(a && a.dataset && a.dataset.field) return; render(); }, 400); } });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ $('#hide').classList.toggle('on'); } });

(function tick(){ var d = new Date(); $('#clock').textContent = d.toTimeString().slice(0,5); setTimeout(tick, 30000); })();
restore();
route();
</script>
</body>
</html>
